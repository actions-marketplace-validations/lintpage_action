name: 'LintPage SEO Check'
description: 'Audit SEO, accessibility, and performance on preview deployments before they reach production'
branding:
  icon: 'search'
  color: 'blue'

inputs:
  urls:
    description: 'URLs to audit, separated by spaces or newlines'
    required: false
  config:
    description: 'Path to LintPage config file'
    required: false
  fail-on-warning:
    description: 'Fail the check on warnings (not just critical issues)'
    required: false
    default: 'false'
  # Commented out until the CLI honours --quiet with --format github, which is
  # the only format this action uses. Today the flag is accepted and ignored.
  # Re-enable together with the QUIET env and the --quiet argument below.
  # quiet:
  #   description: 'Minimal output (counts only)'
  #   required: false
  #   default: 'false'
  version:
    description: 'lintpage CLI version to install (an npm version or dist-tag, e.g. "latest")'
    required: false
    default: '0.5.1'

outputs:
  audited:
    description: 'Number of URLs audited. Skipped entries and protected Vercel deployments are not counted'
    value: ${{ steps.run.outputs.audited }}
  exit-code:
    description: 'Worst result across all URLs: 0 pass, 1 findings, 2 error or a URL that could not be audited'
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Install LintPage
      shell: bash
      env:
        LINTPAGE_VERSION: ${{ inputs.version }}
      # No package in the CLI's tree needs an install script, so none runs.
      run: npm install -g --ignore-scripts "lintpage@${LINTPAGE_VERSION}"

    - name: Run LintPage
      id: run
      shell: bash
      # Every value arrives through env, never through ${{ }} in the script:
      # a deployment URL is set by whoever posts the deployment status.
      env:
        INPUT_URLS: ${{ inputs.urls }}
        DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
        CONFIG: ${{ inputs.config }}
        FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        # QUIET: ${{ inputs.quiet }}
      run: |
        # Split on whitespace only: no glob expansion of ? or * in URLs.
        set -f
        URLS=($INPUT_URLS)
        if [ "${#URLS[@]}" -eq 0 ]; then
          # A deployment has one URL, so it is never split into several
          # entries. Only surrounding whitespace is trimmed.
          DEPLOYMENT_URL="${DEPLOYMENT_URL#"${DEPLOYMENT_URL%%[![:space:]]*}"}"
          DEPLOYMENT_URL="${DEPLOYMENT_URL%"${DEPLOYMENT_URL##*[![:space:]]}"}"
          if [ -n "$DEPLOYMENT_URL" ]; then
            URLS=("$DEPLOYMENT_URL")
          fi
        fi
        if [ "${#URLS[@]}" -eq 0 ]; then
          echo "::error title=LintPage::No URL to audit. Set the 'urls' input, or run on a deployment_status event."
          echo "audited=0" >> "$GITHUB_OUTPUT"
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          exit 2
        fi

        ARGS=(--format github)
        if [ "$FAIL_ON_WARNING" = "true" ]; then
          ARGS+=(--fail-on-warning)
        fi
        if [ -n "$CONFIG" ]; then
          ARGS+=(--config "$CONFIG")
        fi
        # if [ "$QUIET" = "true" ]; then
        #   ARGS+=(--quiet)
        # fi

        # Lowercased host of a URL, without user info or port.
        url_host() {
          local h="${1#*://}"
          h="${h%%[/?#]*}"
          h="${h##*@}"
          h="${h%%:*}"
          printf '%s' "$h" | tr '[:upper:]' '[:lower:]'
        }

        # An http(s) URL on a *.vercel.app host: what Vercel posts as a
        # deployment's target_url.
        is_vercel_app() {
          local lower
          lower=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
          case "$lower" in
            http://*|https://*) ;;
            *) return 1 ;;
          esac
          case "$(url_host "$1")" in
            *.vercel.app) return 0 ;;
          esac
          return 1
        }

        # A Vercel deployment behind Deployment Protection answers with a
        # redirect to the Vercel login page. The CLI follows it and audits that
        # page instead, which passes, so the check would go green without
        # looking at the site. Only *.vercel.app hosts are checked, so no extra
        # request ever goes to the user's own site, another host or a private
        # address. Redirects are not followed: only the first answer's
        # Location is read. Prints the error and succeeds when the URL is a
        # protected deployment. Other protection (a custom domain, another
        # provider) is left to the CLI.
        # If the action ever sends a protection bypass header to the CLI, this
        # request has to send it too.
        protected_deployment() {
          is_vercel_app "$1" || return 1
          [ "$have_curl" = 1 ] || return 1
          local location path
          location=$(curl -q -s -o /dev/null --max-time 15 --proto =http,https \
            -w '%{redirect_url}' -- "$1" 2>/dev/null) || true
          [ "$(url_host "$location")" = "vercel.com" ] || return 1
          path="${location#*://}"
          path="/${path#*/}"
          case "$path" in
            /sso-api*|/login*)
              echo "$1 redirects to the Vercel login page (Deployment Protection), so it cannot be audited. Turn off protection for the deployments you audit, or audit a public URL with the 'urls' input."
              return 0
              ;;
          esac
          return 1
        }

        # Without curl a protected deployment cannot be detected, so say so
        # once rather than letting the login page pass unremarked.
        have_curl=0
        if command -v curl >/dev/null 2>&1; then
          have_curl=1
        else
          for url in "${URLS[@]}"; do
            if is_vercel_app "$url"; then
              echo "::warning title=LintPage::curl is not installed, so a Vercel deployment behind Deployment Protection cannot be detected. The audit may check the Vercel login page instead of the site."
              break
            fi
          done
        fi

        # The CLI audits one URL per run, so each URL gets its own run. Every
        # URL is audited even after a failure, and the step exits with the
        # worst code seen: 1 for findings, 2 for an error.
        status=0
        audited=0
        for url in "${URLS[@]}"; do
          code=0
          case "$url" in
            *[[:cntrl:]]*)
              # A carriage return could end the ::group:: line below early
              # and start a workflow command of the URL's choosing.
              echo "::error title=LintPage::Skipped an entry in the URL list that contains control characters."
              code=2
              ;;
            -*)
              # Would be read as a CLI flag rather than a URL.
              echo "::error title=LintPage::Skipped an entry in the URL list that starts with '-'."
              code=2
              ;;
            *)
              if reason=$(protected_deployment "$url"); then
                echo "::error title=LintPage::$reason"
                code=2
              else
                echo "::group::LintPage $url"
                lintpage "$url" "${ARGS[@]}" || code=$?
                echo "::endgroup::"
                audited=$((audited + 1))
              fi
              ;;
          esac
          # Anything past 2 (127 for a missing CLI, 137 for a killed one) is
          # still an error, and the exit-code output promises 0, 1 or 2.
          if [ "$code" -gt 2 ]; then
            code=2
          fi
          if [ "$code" -gt "$status" ]; then
            status=$code
          fi
        done

        echo "audited=$audited" >> "$GITHUB_OUTPUT"
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit "$status"
