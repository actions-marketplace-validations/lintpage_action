  test-bypass:
    name: Test the bypass secret and origins reach the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A stub CLI records whether the secret arrived intact, whether it
      # appeared in its arguments, and which origins were listed. It records
      # only "match", "mismatch", "unset", "clean" or "leaked". The test value
      # itself is fake and passed as a plain string, so GitHub does show it in
      # the step's input list; a real secret from `secrets` is masked there.
      - name: Put a stub lintpage first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/stub"
          cat > "$RUNNER_TEMP/stub/lintpage" <<'EOF'
          #!/usr/bin/env bash
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET+x}" ]; then s=unset
          elif [ "$VERCEL_AUTOMATION_BYPASS_SECRET" = "$EXPECTED_SECRET" ]; then s=match
          else s=mismatch; fi
          case " $* " in *"$EXPECTED_SECRET"*) a=leaked ;; *) a=clean ;; esac
          [ -z "$EXPECTED_SECRET" ] && a=clean
          echo "$1 secret=$s argv=$a origins=${LINTPAGE_BYPASS_ORIGINS-unset}" >> "$RUNNER_TEMP/bypass.log"
          EOF
          chmod +x "$RUNNER_TEMP/stub/lintpage"
          echo "$RUNNER_TEMP/stub" >> "$GITHUB_PATH"
      - id: with-secret
        uses: ./
        env:
          EXPECTED_SECRET: test-only-not-a-real-secret
        with:
          urls: https://my-app-abc123-team.vercel.app https://example.com/x
          vercel-bypass-secret: test-only-not-a-real-secret
      # The action exports the secret inside its own step only.
      - name: Expect the secret not to reach a later step
        run: |
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET+x}" ] || [ -n "${LINTPAGE_BYPASS_ORIGINS+x}" ]; then
            echo "::error::the bypass variables leaked into a later step"
            exit 1
          fi
      - id: without-secret
        uses: ./
        with:
          urls: https://my-app-abc123-team.vercel.app
      - name: Expect the secret and the audited URLs as origins, only when set
        run: |
          expected='https://my-app-abc123-team.vercel.app secret=match argv=clean origins=https://my-app-abc123-team.vercel.app https://example.com/x
          https://example.com/x secret=match argv=clean origins=https://my-app-abc123-team.vercel.app https://example.com/x
          https://my-app-abc123-team.vercel.app secret=unset argv=clean origins=unset'
          actual=$(cat "$RUNNER_TEMP/bypass.log")
          if [ "$actual" != "$expected" ]; then
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

  test-multiple-urls:
    name: Test that every URL is audited after a failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The failing URL comes first, so this only passes if the loop keeps
      # going after a failure. Newline-separated on purpose.
      - id: lintpage
        uses: ./
        continue-on-error: true
        with:
          urls: |
            ${{ env.BAD_URL }}
            ${{ env.TEST_URL }}
      - name: Expect both URLs audited and the step failed on findings
        if: >-
          steps.lintpage.outputs.audited != '2' || steps.lintpage.outputs.exit-code != '1' ||
          steps.lintpage.outcome != 'failure'
        env:
          AUDITED: ${{ steps.lintpage.outputs.audited }}
          EXIT_CODE: ${{ steps.lintpage.outputs.exit-code }}
          OUTCOME: ${{ steps.lintpage.outcome }}
        run: |
          echo "::error::audited=$AUDITED exit-code=$EXIT_CODE outcome=$OUTCOME"
          exit 1

  test-no-url:
    name: Test missing or blank URL fails clearly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: missing
        uses: ./
        continue-on-error: true
      - id: blank
        uses: ./
        continue-on-error: true
        with:
          urls: '   '
      - name: Expect both to fail without auditing anything
        if: >-
          steps.missing.outcome != 'failure' || steps.missing.outputs.audited != '0' ||
          steps.blank.outcome != 'failure' || steps.blank.outputs.audited != '0'
        env:
          MISSING: ${{ steps.missing.outcome }}/${{ steps.missing.outputs.audited }}
          BLANK: ${{ steps.blank.outcome }}/${{ steps.blank.outputs.audited }}
        run: |
          echo "::error::missing=$MISSING blank=$BLANK"
          exit 1
