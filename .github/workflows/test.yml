name: Test Action
on:
  pull_request:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit'
        default: 'https://lintpage.com'

permissions:
  contents: read

env:
  # inputs.url is empty on pull_request runs.
  TEST_URL: ${{ inputs.url || 'https://lintpage.com' }}
  # Fails DNS, so the CLI reports it unreachable: a critical finding, exit 1.
  BAD_URL: 'https://lintpage-action-test.invalid'

# These tests check the action, not the audited site. Each audit step uses
# continue-on-error, and the assertions read the action's outputs, so findings
# on TEST_URL cannot turn a run red. Exit code 2 means the CLI errored, which
# is what a broken flag or argument would produce.
jobs:
  test-with-url:
    name: Test with explicit URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: lintpage
        uses: ./
        continue-on-error: true
        with:
          urls: ${{ env.TEST_URL }}
      - name: Expect one URL audited without a CLI error
        if: steps.lintpage.outputs.audited != '1' || steps.lintpage.outputs.exit-code == '2'
        env:
          AUDITED: ${{ steps.lintpage.outputs.audited }}
          EXIT_CODE: ${{ steps.lintpage.outputs.exit-code }}
        run: |
          echo "::error::audited=$AUDITED exit-code=$EXIT_CODE"
          exit 1
      # A release that raises the default in action.yml but installs another
      # version, or the reverse, fails here.
      - name: Expect the CLI version pinned in action.yml to be installed
        run: |
          pinned=$(sed -n "/^  version:/,/default:/s/^ *default: '\(.*\)'/\1/p" action.yml)
          installed=$(node -p 'require(process.argv[1] + "/lintpage/package.json").version' "$(npm root -g)")
          echo "pinned=$pinned installed=$installed"
          if [ -z "$pinned" ] || [ "$pinned" != "$installed" ]; then
            echo "::error::action.yml pins lintpage '$pinned' but '$installed' is installed"
            exit 1
          fi

  test-version:
    name: Test the version input picks the CLI installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: lintpage
        uses: ./
        continue-on-error: true
        with:
          urls: ${{ env.TEST_URL }}
          version: '0.5.3'
      - name: Expect lintpage 0.5.3 installed and run
        env:
          AUDITED: ${{ steps.lintpage.outputs.audited }}
          EXIT_CODE: ${{ steps.lintpage.outputs.exit-code }}
        run: |
          installed=$(node -p 'require(process.argv[1] + "/lintpage/package.json").version' "$(npm root -g)")
          echo "installed=$installed audited=$AUDITED exit-code=$EXIT_CODE"
          if [ "$installed" != "0.5.3" ] || [ "$AUDITED" != "1" ] || [ "$EXIT_CODE" = "2" ]; then
            echo "::error::expected lintpage 0.5.3 to audit one URL"
            exit 1
          fi

  test-flags:
    name: Test the real CLI accepts fail-on-warning and quiet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: lintpage
        uses: ./
        continue-on-error: true
        with:
          urls: ${{ env.TEST_URL }}
          fail-on-warning: 'true'
          quiet: 'true'
      - name: Expect the CLI to accept the flags
        if: steps.lintpage.outputs.audited != '1' || steps.lintpage.outputs.exit-code == '2'
        env:
          AUDITED: ${{ steps.lintpage.outputs.audited }}
          EXIT_CODE: ${{ steps.lintpage.outputs.exit-code }}
        run: |
          echo "::error::audited=$AUDITED exit-code=$EXIT_CODE"
          exit 1

  test-forwarding:
    name: Test what the action passes to the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A stub ahead of the real CLI on PATH records each call's arguments, one
      # bracketed argument at a time, so argument boundaries are visible. It
      # exits 127 for one URL to stand in for a missing or crashed CLI.
      - name: Put a stub lintpage first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/stub"
          cat > "$RUNNER_TEMP/stub/lintpage" <<'EOF'
          #!/usr/bin/env bash
          printf '[%s]' "$@" >> "$RUNNER_TEMP/argv.log"
          echo >> "$RUNNER_TEMP/argv.log"
          case "$1" in
            *exit127*) exit 127 ;;
          esac
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/stub/lintpage"
          echo "$RUNNER_TEMP/stub" >> "$GITHUB_PATH"
      # Entries: a plain URL, one that looks like a flag, one with a carriage
      # return in it, and one the stub fails with 127. Only the first and last
      # may reach the CLI, and 127 has to be reported as 2.
      - id: lintpage
        uses: ./
        continue-on-error: true
        with:
          urls: "https://one.example -h https://cr.example/\rnot-a-url https://two.example/exit127"
          config: 'seo dir/lintpage config.json'
          fail-on-warning: 'true'
          quiet: 'true'
      - name: Expect each URL as one argument with every flag, and bad entries skipped
        env:
          AUDITED: ${{ steps.lintpage.outputs.audited }}
          EXIT_CODE: ${{ steps.lintpage.outputs.exit-code }}
          OUTCOME: ${{ steps.lintpage.outcome }}
        run: |
          flags='[--format][github][--fail-on-warning][--config][seo dir/lintpage config.json][--quiet]'
          expected="[https://one.example]$flags
          [https://two.example/exit127]$flags"
          actual=$(cat "$RUNNER_TEMP/argv.log")
          if [ "$actual" != "$expected" ] || [ "$AUDITED" != '2' ] ||
             [ "$EXIT_CODE" != '2' ] || [ "$OUTCOME" != 'failure' ]; then
            echo "::error::audited=$AUDITED exit-code=$EXIT_CODE outcome=$OUTCOME"
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

