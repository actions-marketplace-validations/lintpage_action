name: Test Action
on:
  pull_request:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit'
        default: 'https://lintpage.com'

permissions:
  contents: read

env:
  # inputs.url is empty on pull_request runs.
  TEST_URL: ${{ inputs.url || 'https://lintpage.com' }}
  # Fails DNS, so the CLI reports it unreachable: a critical finding, exit 1.
  BAD_URL: 'https://lintpage-action-test.invalid'

# These tests check the action, not the audited site. Each audit step uses
# continue-on-error, and the assertions read the action's outputs, so findings
# on TEST_URL cannot turn a run red. Exit code 2 means the CLI errored, which
# is what a broken flag or argument would produce.
jobs:
  test-with-url:
    name: Test with explicit URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: lintpage
        uses: ./
        continue-on-error: true
        with:
          urls: ${{ env.TEST_URL }}
      - name: Expect one URL audited without a CLI error
        if: steps.lintpage.outputs.audited != '1' || steps.lintpage.outputs.exit-code == '2'
        env:
          AUDITED: ${{ steps.lintpage.outputs.audited }}
          EXIT_CODE: ${{ steps.lintpage.outputs.exit-code }}
        run: |
          echo "::error::audited=$AUDITED exit-code=$EXIT_CODE"
          exit 1

  test-flags:
    name: Test fail-on-warning and quiet flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: lintpage
        uses: ./
        continue-on-error: true
        with:
          urls: ${{ env.TEST_URL }}
          fail-on-warning: 'true'
          quiet: 'true'
      - name: Expect the CLI to accept the flags
        if: steps.lintpage.outputs.audited != '1' || steps.lintpage.outputs.exit-code == '2'
        env:
          AUDITED: ${{ steps.lintpage.outputs.audited }}
          EXIT_CODE: ${{ steps.lintpage.outputs.exit-code }}
        run: |
          echo "::error::audited=$AUDITED exit-code=$EXIT_CODE"
          exit 1

  test-multiple-urls:
    name: Test that every URL is audited after a failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The failing URL comes first, so this only passes if the loop keeps
      # going after a failure. Newline-separated on purpose.
      - id: lintpage
        uses: ./
        continue-on-error: true
        with:
          urls: |
            ${{ env.BAD_URL }}
            ${{ env.TEST_URL }}
      - name: Expect both URLs audited and the step failed
        if: steps.lintpage.outputs.audited != '2' || steps.lintpage.outcome != 'failure'
        env:
          AUDITED: ${{ steps.lintpage.outputs.audited }}
          OUTCOME: ${{ steps.lintpage.outcome }}
        run: |
          echo "::error::audited=$AUDITED outcome=$OUTCOME"
          exit 1

  test-no-url:
    name: Test missing or blank URL fails clearly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: missing
        uses: ./
        continue-on-error: true
      - id: blank
        uses: ./
        continue-on-error: true
        with:
          urls: '   '
      - name: Expect both to fail without auditing anything
        if: >-
          steps.missing.outcome != 'failure' || steps.missing.outputs.audited != '0' ||
          steps.blank.outcome != 'failure' || steps.blank.outputs.audited != '0'
        env:
          MISSING: ${{ steps.missing.outcome }}/${{ steps.missing.outputs.audited }}
          BLANK: ${{ steps.blank.outcome }}/${{ steps.blank.outputs.audited }}
        run: |
          echo "::error::missing=$MISSING blank=$BLANK"
          exit 1
